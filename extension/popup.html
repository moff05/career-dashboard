<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      background: #101012;
      color: #F5F5F5;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 12px;
      padding: 14px;
    }
    .brand { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
    .brand-accent { color: #F97316; }

    .domain { color: #7D838D; font-size: 11px; margin-bottom: 3px; }
    .title {
      color: #F5F5F5; font-size: 12px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 12px;
    }
    .muted { color: #7D838D; line-height: 1.55; }

    .btn {
      display: block; width: 100%; padding: 8px 12px;
      font-family: inherit; font-size: 12px; font-weight: 700;
      border-radius: 6px; cursor: pointer; border: none; text-align: center;
      background: #F97316; color: #101012;
      transition: background 0.12s;
    }
    .btn:hover { background: #FB923C; }

    #s-dashboard { display: none; }
  </style>
</head>
<body>
  <div class="brand">jobs<span class="brand-accent">_</span></div>

  <div id="s-clip">
    <div class="domain" id="job-domain"></div>
    <div class="title" id="job-title"></div>
    <button class="btn" id="btn-clip">Add to tracker</button>
  </div>

  <div id="s-dashboard">
    <p class="muted">You're on the dashboard.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
